<svg viewBox="0 0 1200 380" width="100%" height="340" xmlns="http://www.w3.org/2000/svg">
    <style>
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .box-bg { fill: #e6f4ea; stroke: #a7cdb3; stroke-width: 1; }
        .title { font-weight: 700; font-size: 16px; fill: #1a202c; }
        .content { font-size: 13px; fill: #4a5568; }
    </style>

    <g>
        <rect class="box-bg" x="20" y="20" width="570" height="100" rx="6"/>
        <rect x="20" y="20" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="50">Framework Agnostic</text>
        <text class="content" x="40" y="78">Plain PHP &#8226; Yii2 &#8226; Yii3 &#8226; Other frameworks</text>
        <text class="content" x="40" y="98">Concrete paths and URLs with constructor injection</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="20" width="570" height="100" rx="6"/>
        <rect x="610" y="20" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="50">Development Server</text>
        <text class="content" x="630" y="78">@vite/client &#8226; Entrypoints &#8226; Custom preambles</text>
        <text class="content" x="630" y="98">No Vite installation or JavaScript dependency management</text>
    </g>

    <g>
        <rect class="box-bg" x="20" y="140" width="570" height="100" rx="6"/>
        <rect x="20" y="140" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="170">Strict Manifests</text>
        <text class="content" x="40" y="198">Current Vite schema &#8226; Explicit validation &#8226; Caching</text>
        <text class="content" x="40" y="218">Actionable package exceptions for invalid input</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="140" width="570" height="100" rx="6"/>
        <rect x="610" y="140" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="170">Complete Asset Graph</text>
        <text class="content" x="630" y="198">Static imports &#8226; CSS &#8226; Modulepreload &#8226; Multiple entries</text>
        <text class="content" x="630" y="218">Stable ordering, deduplication, and cycle protection</text>
    </g>

    <g>
        <rect class="box-bg" x="20" y="260" width="570" height="100" rx="6"/>
        <rect x="20" y="260" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="290">Neutral Asset Model</text>
        <text class="content" x="40" y="318">Module scripts &#8226; Stylesheets &#8226; Preloads &#8226; Inline modules</text>
        <text class="content" x="40" y="338">Resolution is independent from HTML representation</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="260" width="570" height="100" rx="6"/>
        <rect x="610" y="260" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="290">Safe HTML and CSP</text>
        <text class="content" x="630" y="318">Escaped URLs &#8226; Controlled attributes &#8226; Per-response nonce</text>
        <text class="content" x="630" y="338">Optional renderer with an explicit security policy</text>
    </g>
</svg>
