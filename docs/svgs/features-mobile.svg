<!-- Mobile version - Single column -->
<svg viewBox="0 0 620 620" width="100%" height="580" xmlns="http://www.w3.org/2000/svg">
    <style>
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .box-bg { fill: #e6f4ea; stroke: #a7cdb3; stroke-width: 1; }
        .title { font-weight: 700; font-size: 14px; fill: #1a202c; }
        .content { font-size: 11px; fill: #4a5568; }
    </style>

    <g>
        <rect class="box-bg" x="16" y="16" width="588" height="84" rx="6"/>
        <rect x="16" y="16" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="42">Framework Agnostic</text>
        <text class="content" x="32" y="66">Plain PHP &#8226; Yii2 &#8226; Yii3 &#8226; Other frameworks</text>
        <text class="content" x="32" y="84">Concrete paths and URLs with constructor injection</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="116" width="588" height="84" rx="6"/>
        <rect x="16" y="116" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="142">Development Server</text>
        <text class="content" x="32" y="166">@vite/client &#8226; Entrypoints &#8226; Custom preambles</text>
        <text class="content" x="32" y="184">No Vite installation or JavaScript dependency management</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="216" width="588" height="84" rx="6"/>
        <rect x="16" y="216" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="242">Strict Manifests</text>
        <text class="content" x="32" y="266">Current Vite schema &#8226; Explicit validation &#8226; Caching</text>
        <text class="content" x="32" y="284">Actionable package exceptions for invalid input</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="316" width="588" height="84" rx="6"/>
        <rect x="16" y="316" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="342">Complete Asset Graph</text>
        <text class="content" x="32" y="366">Static imports &#8226; CSS &#8226; Modulepreload &#8226; Multiple entries</text>
        <text class="content" x="32" y="384">Stable ordering, deduplication, and cycle protection</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="416" width="588" height="84" rx="6"/>
        <rect x="16" y="416" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="442">Neutral Asset Model</text>
        <text class="content" x="32" y="466">Module scripts &#8226; Stylesheets &#8226; Preloads &#8226; Inline modules</text>
        <text class="content" x="32" y="484">Resolution is independent from HTML representation</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="516" width="588" height="84" rx="6"/>
        <rect x="16" y="516" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="542">Safe HTML and CSP</text>
        <text class="content" x="32" y="566">Escaped URLs &#8226; Controlled attributes &#8226; Per-response nonce</text>
        <text class="content" x="32" y="584">Optional renderer with an explicit security policy</text>
    </g>
</svg>
